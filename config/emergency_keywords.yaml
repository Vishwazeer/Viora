# Viora — Emergency Keyword Lexicon
# Triggers immediate human escalation + 108 advisory.
# Words are matched case-insensitively and as substrings.

english:
  cardiac:
    - "chest pain"
    - "chest tightness"
    - "heart attack"
    - "heart pain"
    - "palpitations"
    - "my heart is racing"
    - "cardiac arrest"
  respiratory:
    - "can't breathe"
    - "cannot breathe"
    - "trouble breathing"
    - "breathing problem"
    - "shortness of breath"
    - "choking"
    - "suffocating"
  neurological:
    - "unconscious"
    - "passed out"
    - "fainted"
    - "stroke"
    - "seizure"
    - "convulsion"
    - "fits"
    - "can't move"
    - "face drooping"
  haemorrhage:
    - "heavy bleeding"
    - "bleeding heavily"
    - "bleeding won't stop"
    - "blood everywhere"
    - "coughing blood"
    - "throwing up blood"
  mental_health:
    - "want to die"
    - "end my life"
    - "kill myself"
    - "suicide"
    - "self harm"
    - "hurt myself"
  general:
    - "emergency"
    - "ambulance"
    - "call 108"
    - "it's serious"
    - "very serious"
    - "life threatening"
    - "dying"

