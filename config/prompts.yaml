# FAQ entries â€“ intent matched via semantic similarity in agent/tools/faq.py
faq:
  - question: "Do you have parking?"
    answer: "Yes, we have free parking available for patients."
  - question: "Is the clinic wheelchair accessible?"
    answer: "Yes, we are fully wheelchair accessible with ramps and a dedicated lift."
  - question: "Can I get a prescription without visiting?"
    answer: "Prescription refills for existing patients can be reviewed by our doctor. I can log the request and our team will call you back."
  - question: "Do you do home visits?"
    answer: "We currently do not offer home visits. However, we do offer telemedicine appointments."
  - question: "How early should I arrive before my appointment?"
